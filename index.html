<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart POS Scanner</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- QR Generator -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-full bg-slate-900 text-white flex flex-col">

  <header class="bg-slate-800 p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">Smart POS</h1>
  </header>

  <main class="flex-1 p-4 max-w-xl mx-auto w-full space-y-6">

    <!-- QR Scanner -->
    <div class="space-y-2">
      <button id="toggle-scanner" class="px-4 py-2 bg-emerald-500 rounded-lg">Start Scanner</button>
      <div id="qr-reader" class="w-full h-64 rounded-xl overflow-hidden" style="display:none;"></div>
    </div>

    <!-- Manual Add -->
    <div class="flex gap-2">
      <input type="text" id="manual-name" placeholder="Product name" class="flex-1 px-3 py-2 bg-slate-800 rounded-lg">
      <input type="number" id="manual-price" placeholder="Price" class="w-24 px-3 py-2 bg-slate-800 rounded-lg">
      <button id="add-manual" class="px-4 py-2 bg-emerald-500 rounded-lg">Add</button>
    </div>

    <!-- Cart -->
    <div class="bg-slate-800 p-4 rounded-xl space-y-2">
      <h2 class="font-bold text-lg">Cart</h2>
      <div id="cart-items" class="space-y-1"></div>
      <div class="font-bold mt-2">Total: ₹<span id="cart-total">0.00</span></div>
    </div>

    <!-- Payment -->
    <div class="bg-emerald-600 p-4 rounded-xl space-y-2">
      <input type="tel" id="customer-phone" placeholder="+91 98765 43210" class="w-full px-3 py-2 rounded-lg text-black">
      <button id="send-sms" class="w-full px-4 py-2 bg-white text-emerald-700 rounded-lg font-bold">Send Bill & Generate QR</button>
      <div id="qr-display" class="w-48 h-48 mx-auto mt-4"></div>
    </div>

  </main>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
